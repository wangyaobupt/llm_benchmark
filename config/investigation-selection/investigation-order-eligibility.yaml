    "Vitals/Monitoring": monitoring_only
    Activity: excluded_non_investigation
    Other: excluded_non_investigation
    "Tubes/Drains": excluded_non_investigation
    "Code status": excluded_non_investigation
    Restraints: excluded_non_investigation
    "Therapeutic devices/DVT/Prophylaxis": excluded_non_investigation
    "Wound Care": excluded_non_investigation
    Precautions: excluded_non_investigation
    Dialysis: excluded_non_investigation
    "*": excluded_non_investigation
  "Critical Care":
    "Hemodynamic monitoring": monitoring_only
    "Cardiac monitoring": monitoring_only
    "Intra-cranial monitoring": monitoring_only
    "Suspected VAP Pathway": excluded_non_investigation
    "*": excluded_non_investigation
  Medications:
    "*": excluded_non_investigation
  "IV therapy":
    "*": excluded_non_investigation
  Nutrition:
    "*": excluded_non_investigation
  "ADT orders":
    "*": excluded_non_investigation
