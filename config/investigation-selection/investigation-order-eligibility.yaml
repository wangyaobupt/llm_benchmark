schema_version: investigation-order-eligibility/1.0.0
status: protocol_frozen
clinical_review: protocol_adjudicated_not_dual_reviewed
source_audit: data/derived/investigation_timepoint/poe-subtype-audit-1000.json
freeze_note: >
  Every order_type x subtype seen in the 1,000-admission aggregation is classified
  below. Telemetry is monitoring_only (continuous monitoring, not a discrete
  investigation). Lab POE remains generic_lab_order only. Unseen types stay
  review_required until a protocol bump.
default_eligibility: review_required
types:
  Lab:
    "*": eligible_investigation
  Radiology:
    "*": eligible_investigation
  Cardiology:
    ECG: eligible_investigation
    Echo: eligible_investigation
    "ETT (Non-Imaging)": eligible_investigation
    "Stress Echo": eligible_investigation
    "Holter Monitor": eligible_investigation
    Holter: eligible_investigation
    "Stress Test": eligible_investigation
    "Cardiac Cath": eligible_investigation
    "*": review_required
  Neurology:
    EEG: eligible_investigation
    EMG: eligible_investigation
    "*": review_required
  "Blood Bank":
    "Blood tests": eligible_investigation
    "Red Cell Product Order": excluded_non_investigation
    "Frozen Plasma Product Order": excluded_non_investigation
    "Platelet Product Order": excluded_non_investigation
    "Cryoprecipitate Product Order": excluded_non_investigation
    "*": excluded_non_investigation
  Respiratory:
    "Pulmonary Function Test": eligible_investigation
    "Mechanical Ventilation": excluded_non_investigation
    "Oxygen Therapy": excluded_non_investigation
    "CPAP for OSA": excluded_non_investigation
    Extubate: excluded_non_investigation
    BiPAP: excluded_non_investigation
    "Special Procedures": excluded_non_investigation
    "*": excluded_non_investigation
  "General Care":
