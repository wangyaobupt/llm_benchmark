[project]
name = "mimic-benchmark"
version = "0.1.0"
description = "Local, reproducible extraction pipeline for MIMIC text and multimodal benchmark data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "pandas",
    "numpy",
    "matplotlib",
    "openai",
    "pyarrow>=25.0.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.2",
]

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "never"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
