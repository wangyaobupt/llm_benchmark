[project]
name = "mimic-benchmark"
version = "0.1.0"
description = "Local, reproducible extraction pipeline for MIMIC text and multimodal benchmark data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "pandas",
    "numpy",
    "matplotlib",
    "openai",
]

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "never"
