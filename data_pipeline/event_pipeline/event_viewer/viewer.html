<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MIMIC 事件流水线浏览器</title>
  <style>
    :root{--ink:#152521;--muted:#66736f;--line:#dce4e0;--paper:#f7f8f3;--card:#fff;--accent:#087f5b;--accent2:#dff4e9;--warn:#a15c00;--shadow:0 14px 36px rgba(25,52,43,.09)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(140deg,#edf4ed 0,#f8f6ef 38%,#f4f7f2 100%);color:var(--ink);font:14px/1.5 ui-sans-serif,"Microsoft YaHei",sans-serif}
    header{padding:28px 34px 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.76);backdrop-filter:blur(12px);position:sticky;top:0;z-index:4}
    h1{font-size:24px;letter-spacing:-.4px;margin:0 0 5px} .subtitle{color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{font-size:12px;background:var(--accent2);color:var(--accent);padding:3px 9px;border-radius:999px;font-weight:700}.path{font-family:Consolas,monospace;font-size:12px}
    main{padding:22px 34px 44px}.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}.card .n{font-size:24px;font-weight:750;margin-top:4px}.card .k{font-size:12px;color:var(--muted)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.tabs{display:flex;gap:4px;padding:12px 14px 0;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;padding:10px 14px;border-radius:9px 9px 0 0;color:var(--muted);cursor:pointer;white-space:nowrap}.tab.active{background:var(--accent2);color:var(--accent);font-weight:700}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}input,select,button{font:inherit}input,select{height:36px;border:1px solid #cfd9d4;border-radius:8px;padding:0 10px;background:white;min-width:130px}input[name=q]{min-width:240px;flex:1}.btn{height:36px;border:0;border-radius:8px;padding:0 14px;background:var(--accent);color:white;cursor:pointer}.btn.ghost{background:#edf1ef;color:var(--ink)}
    .status{padding:9px 14px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.table-wrap{overflow:auto;max-height:62vh;border-top:1px solid var(--line)}table{width:100%;border-collapse:separate;border-spacing:0;white-space:nowrap}th{position:sticky;top:0;background:#f3f6f3;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;color:#52615c}td{padding:9px 12px;border-bottom:1px solid #edf0ee;max-width:360px;overflow:hidden;text-overflow:ellipsis}tbody tr{cursor:pointer}tbody tr:hover{background:#f0f8f4}.pager{padding:13px 14px;display:flex;justify-content:flex-end;align-items:center;gap:9px}
    .drawer{position:fixed;inset:0;z-index:10;display:none}.drawer.open{display:block}.shade{position:absolute;inset:0;background:rgba(12,26,22,.32)}.sheet{position:absolute;right:0;top:0;bottom:0;width:min(720px,94vw);background:#fff;padding:22px;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.15)}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:-22px;background:#fff;padding:20px 0 12px;border-bottom:1px solid var(--line);z-index:2}.sheet h2{margin:0;font-size:19px}.fields{display:grid;grid-template-columns:180px 1fr;margin-top:12px;border-top:1px solid var(--line)}.fields dt,.fields dd{margin:0;padding:9px 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.fields dt{color:var(--muted);font-family:Consolas,monospace;font-size:12px}.json{white-space:pre-wrap;background:#f3f5f3;border-radius:9px;padding:12px;font:12px/1.55 Consolas,monospace;overflow:auto}.empty{padding:50px;text-align:center;color:var(--muted)}.error{color:#a03220}.source-note{margin:12px 0;padding:10px 12px;border-left:3px solid var(--warn);background:#fff7e6;color:#70400a}
    @media(max-width:850px){header,main{padding-left:16px;padding-right:16px}.cards{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.fields dt{border-bottom:0;padding-bottom:0}.fields dd{padding-top:3px}}
  </style>
</head>
<body>
  <header><h1>MIMIC 事件流水线浏览器</h1><div class="subtitle"><span class="badge">只读 · 本机</span><span id="path" class="path">正在连接…</span></div></header>
  <main><section id="cards" class="cards"></section><section class="panel"><nav id="tabs" class="tabs"></nav><form id="filters" class="toolbar"><input name="q" placeholder="搜索术语、ID 或来源引用"><input data-column="jsonl_line_number" placeholder="JSONL 行号"><input data-column="subject_id" placeholder="subject_id"><input data-column="hadm_id" placeholder="hadm_id"><select data-column="event_kind"><option value="">全部事件类型</option></select><select data-column="source_table"><option value="">全部源表</option></select><select data-column="entity_type"><option value="">全部实体类型</option></select><select data-column="reason_code"><option value="">全部拒绝原因</option></select><button class="btn" type="submit">查询</button><button id="reset" class="btn ghost" type="button">重置</button></form><div class="status"><span id="result-status"></span><span id="source-status"></span></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><select id="page-size"><option>20</option><option selected>50</option><option>100</option><option>200</option></select><button id="prev" class="btn ghost">上一页</button><span id="page-label"></span><button id="next" class="btn ghost">下一页</button></div></section></main>
  <aside id="drawer" class="drawer"><div class="shade" data-close></div><section class="sheet"><div class="sheet-head"><h2 id="detail-title">记录详情</h2><div><button id="source-button" class="btn" hidden>查看原始源行</button> <button class="btn ghost" data-close>关闭</button></div></div><div id="detail"></div></section></aside>
  <script>
    const state={catalog:null,dataset:"cleaned_events",page:1,total:0,rows:[]};
    const $=s=>document.querySelector(s); const fmt=n=>new Intl.NumberFormat("zh-CN").format(n);
    function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    async function api(path){const r=await fetch(path);const x=await r.json();if(!r.ok)throw new Error(x.error||r.statusText);return x;}
    function dataset(){return state.catalog.datasets.find(x=>x.name===state.dataset);}
    async function init(){try{state.catalog=await api("/api/catalog");$("#path").textContent=state.catalog.cleaning_dir;$("#source-status").textContent=state.catalog.source_jsonl?"源 JSONL 已连接":"未定位源 JSONL";$("#cards").innerHTML=state.catalog.datasets.map(d=>`<article class="card"><div class="k">${esc(d.title)}</div><div class="n">${fmt(d.count)}</div></article>`).join("");$("#tabs").innerHTML=state.catalog.datasets.map(d=>`<button class="tab ${d.name===state.dataset?"active":""}" data-dataset="${d.name}">${esc(d.title)} · ${fmt(d.count)}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchDataset(b.dataset.dataset));await setupFilters();await load();}catch(e){$("#path").textContent=e.message;$("#path").classList.add("error");}}
    async function setupFilters(){const available=new Set(dataset().filters);for(const el of document.querySelectorAll("[data-column]")){const col=el.dataset.column;el.hidden=!available.has(col);el.value="";if(el.tagName==="SELECT"&&available.has(col)){const first=el.options[0].outerHTML;try{const x=await api(`/api/distinct?dataset=${encodeURIComponent(state.dataset)}&column=${col}`);el.innerHTML=first+x.values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");}catch{el.innerHTML=first;}}}}
    async function switchDataset(name){state.dataset=name;state.page=1;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.dataset===name));$("#filters").reset();await setupFilters();await load();}
    async function load(){const p=new URLSearchParams({dataset:state.dataset,page:String(state.page),page_size:$("#page-size").value});const q=new FormData($("#filters")).get("q");if(q)p.set("q",q);document.querySelectorAll("[data-column]:not([hidden])").forEach(el=>{if(el.value)p.set(el.dataset.column,el.value)});$("#result-status").textContent="查询中…";try{const x=await api("/api/rows?"+p);state.total=x.total;state.rows=x.rows;render();}catch(e){$("#result-status").textContent=e.message;$("#tbody").innerHTML=`<tr><td class="error">${esc(e.message)}</td></tr>`;}}
    function display(v){if(v===null||v===undefined||v==="")return '<span style="color:#9aa39f">—</span>';if(typeof v==="object")return esc(JSON.stringify(v));return esc(v);}
    function render(){const d=dataset(),cols=d.preview_columns;$("#thead").innerHTML="<tr>"+cols.map(c=>`<th>${esc(c)}</th>`).join("")+"</tr>";$("#tbody").innerHTML=state.rows.length?state.rows.map((r,i)=>`<tr data-index="${i}">${cols.map(c=>`<td title="${esc(typeof r[c]==="object"?JSON.stringify(r[c]):r[c]??"")}">${display(r[c])}</td>`).join("")}</tr>`).join(""):`<tr><td class="empty" colspan="${cols.length}">没有匹配记录</td></tr>`;document.querySelectorAll("tbody tr[data-index]").forEach(tr=>tr.onclick=()=>openDetail(state.rows[Number(tr.dataset.index)]));const pages=Math.max(1,Math.ceil(state.total/Number($("#page-size").value)));$("#result-status").textContent=`共 ${fmt(state.total)} 条，当前显示 ${state.rows.length} 条`;$("#page-label").textContent=`第 ${state.page} / ${pages} 页`;$("#prev").disabled=state.page<=1;$("#next").disabled=state.page>=pages;}
    function fieldValue(v){if(typeof v==="object"&&v!==null)return `<pre class="json">${esc(JSON.stringify(v,null,2))}</pre>`;if(typeof v==="string"&&(v.startsWith("{")||v.startsWith("["))){try{return `<pre class="json">${esc(JSON.stringify(JSON.parse(v),null,2))}</pre>`}catch{}}return display(v);}
    function openDetail(row){$("#detail-title").textContent=dataset().title+"详情";$("#detail").innerHTML=`<dl class="fields">${Object.entries(row).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${fieldValue(v)}</dd>`).join("")}</dl>`;const b=$("#source-button");b.hidden=!row.raw_row_ref||!state.catalog.source_jsonl;b.onclick=()=>openSource(row.raw_row_ref);$("#drawer").classList.add("open");}
    async function openSource(ref){$("#detail").innerHTML='<p>正在读取原始 JSONL…</p>';try{const x=await api("/api/source?raw_row_ref="+encodeURIComponent(ref));$("#detail-title").textContent="原始源行";$("#detail").innerHTML=`<p class="source-note">此处显示源 JSONL 中对应数组元素，内容未修改。</p><dl class="fields"><dt>raw_row_ref</dt><dd>${esc(x.raw_row_ref)}</dd><dt>source_row</dt><dd><pre class="json">${esc(JSON.stringify(x.source_row,null,2))}</pre></dd></dl>`;$("#source-button").hidden=true;}catch(e){$("#detail").innerHTML=`<p class="error">${esc(e.message)}</p>`;}}
    $("#filters").onsubmit=e=>{e.preventDefault();state.page=1;load()};$("#reset").onclick=()=>{$("#filters").reset();state.page=1;load()};$("#page-size").onchange=()=>{state.page=1;load()};$("#prev").onclick=()=>{if(state.page>1){state.page--;load()}};$("#next").onclick=()=>{state.page++;load()};document.querySelectorAll("[data-close]").forEach(x=>x.onclick=()=>$("#drawer").classList.remove("open"));document.onkeydown=e=>{if(e.key==="Escape")$("#drawer").classList.remove("open")};init();
  </script>
</body>
</html>
